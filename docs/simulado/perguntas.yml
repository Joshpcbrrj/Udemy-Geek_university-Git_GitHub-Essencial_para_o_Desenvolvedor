# ---------------------------------------------------------------- Módulo 1
- modulo: 1
  aula: 01-introducao/01-controle-de-versao.md
  pergunta: 'Qual é a principal característica de um sistema de controle de versão **distribuído**?'
  opcoes:
    - 'Só o servidor guarda o histórico; cada pessoa tem apenas os arquivos atuais.'
    - 'Cada pessoa tem uma cópia completa do projeto, incluindo todo o histórico.'
    - 'Os arquivos ficam divididos entre vários servidores, um pedaço em cada.'
    - 'Ele só funciona com conexão permanente à internet.'
  resposta: 1
  explicacao: 'No modelo distribuído (como o Git), cada cópia do repositório tem o histórico inteiro, o que permite trabalhar offline e restaurar o projeto a partir de qualquer cópia.'

- modulo: 1
  aula: 01-introducao/01-controle-de-versao.md
  pergunta: 'Qual destes é um exemplo de sistema de controle de versão **centralizado**?'
  opcoes:
    - 'Git'
    - 'Mercurial'
    - 'GitHub'
    - 'SVN (Subversion)'
  resposta: 3
  explicacao: 'SVN e CVS são centralizados. Git e Mercurial são distribuídos, e o GitHub nem é um sistema de controle de versão: é uma plataforma que hospeda repositórios Git.'

- modulo: 1
  aula: 01-introducao/02-o-que-e-git.md
  pergunta: 'Quem criou o Git e em que ano?'
  opcoes:
    - 'Linus Torvalds, em 2005.'
    - 'A Microsoft, em 2018.'
    - 'Os fundadores do GitHub, em 2008.'
    - 'Linus Torvalds, em 1991.'
  resposta: 0
  explicacao: 'Linus Torvalds criou o Git em 2005 para coordenar o desenvolvimento do kernel do Linux. Em 1991 ele criou o próprio Linux; a Microsoft comprou o GitHub em 2018.'

- modulo: 1
  aula: 01-introducao/02-o-que-e-git.md
  pergunta: 'Por que quase todas as operações do Git são muito rápidas?'
  opcoes:
    - 'Porque o Git compacta os arquivos antes de enviá-los ao servidor.'
    - 'Porque o GitHub tem servidores muito potentes.'
    - 'Porque o histórico fica no seu computador, então as operações não dependem da rede.'
    - 'Porque o Git só guarda o último commit.'
  resposta: 2
  explicacao: 'Como o Git é distribuído, commit, log, diff e a maioria dos comandos trabalham direto no seu disco, sem esperar por um servidor.'

- modulo: 1
  aula: 01-introducao/03-git-nao-e-github.md
  pergunta: 'Qual afirmação descreve corretamente a relação entre Git e GitHub?'
  opcoes:
    - 'São nomes diferentes para a mesma ferramenta.'
    - 'O Git é a ferramenta de controle de versão; o GitHub é uma plataforma online que hospeda repositórios Git.'
    - 'O GitHub é a ferramenta instalada no computador; o Git é o site.'
    - 'Para usar o Git é obrigatório ter uma conta no GitHub.'
  resposta: 1
  explicacao: 'O Git funciona sozinho no seu computador, sem conta em lugar nenhum. O GitHub é um dos serviços onde você pode hospedar esses repositórios para compartilhar e colaborar.'

- modulo: 1
  aula: 01-introducao/03-git-nao-e-github.md
  pergunta: 'Qual destes recursos pertence ao **GitHub**, e não ao Git?'
  opcoes:
    - 'Commit'
    - 'Branch'
    - 'Pull request'
    - 'Merge'
  resposta: 2
  explicacao: 'Commit, branch e merge são recursos do próprio Git. O pull request é uma funcionalidade da plataforma GitHub (no GitLab ele se chama merge request).'

- modulo: 1
  aula: 01-introducao/04-instalando-o-git.md
  pergunta: 'Qual comando mostra se o Git está instalado e qual é a versão?'
  opcoes:
    - '`git --version`'
    - '`git status`'
    - '`git init`'
    - '`git config --list`'
  resposta: 0
  explicacao: '`git --version` mostra algo como `git version 2.45.1`. Se aparecer um erro de comando não encontrado, o Git não está instalado.'

- modulo: 1
  aula: 01-introducao/04-instalando-o-git.md
  pergunta: 'Para que serve configurar `user.name` e `user.email` no Git?'
  opcoes:
    - 'Para fazer login no GitHub pelo terminal.'
    - 'Para criptografar os commits.'
    - 'Para receber notificações por e-mail a cada commit.'
    - 'Para assinar cada commit com seu nome e e-mail no histórico.'
  resposta: 3
  explicacao: 'Nome e e-mail ficam registrados em cada commit como autor. Eles não são uma credencial de login. Usar o mesmo e-mail da sua conta liga os commits ao seu perfil no GitHub.'

- modulo: 1
  aula: 01-introducao/05-usuarios-locais.md
  pergunta: 'Você configurou um e-mail com `git config --global` e outro com `git config` (sem `--global`) dentro de um projeto. Qual e-mail será usado nos commits desse projeto?'
  opcoes:
    - 'O global, porque ele foi configurado primeiro.'
    - 'O local, porque a configuração do repositório tem prioridade sobre a global.'
    - 'Os dois, separados por vírgula.'
    - 'Nenhum: o Git mostra um erro por haver conflito.'
  resposta: 1
  explicacao: 'A configuração local (salva em `.git/config`) sempre vence a global. Isso permite usar uma conta pessoal como padrão e outra só nos projetos do trabalho.'

- modulo: 1
  aula: 01-introducao/05-usuarios-locais.md
  pergunta: 'Ao fazer `git push` pelo terminal, o GitHub pede autenticação. O que **não** funciona mais?'
  opcoes:
    - 'Digitar a senha da sua conta do GitHub.'
    - 'Usar um Personal Access Token no lugar da senha.'
    - 'Usar uma chave SSH.'
    - 'Fazer login pelo navegador com o Git Credential Manager.'
  resposta: 0
  explicacao: 'Desde 2021 o GitHub não aceita a senha da conta em operações pelo terminal. É preciso usar token, SSH ou o login pelo navegador.'

# ---------------------------------------------------------------- Módulo 2
- modulo: 2
  aula: 02-git-basico/01-como-o-git-funciona.md
  pergunta: 'O que o comando `git init` faz?'
  opcoes:
    - 'Baixa um repositório do GitHub.'
    - 'Cria o primeiro commit do projeto.'
    - 'Transforma a pasta atual em um repositório, criando a pasta oculta `.git`.'
    - 'Instala o Git no computador.'
  resposta: 2
  explicacao: '`git init` cria a pasta `.git`, onde o Git guarda todo o histórico. Para baixar um repositório existente, o comando é `git clone`.'

- modulo: 2
  aula: 02-git-basico/01-como-o-git-funciona.md
  pergunta: 'Depois de rodar `git add arquivo.txt`, onde ficam as alterações desse arquivo?'
  opcoes:
    - 'No repositório remoto.'
    - 'Na staging area (área de preparação).'
    - 'Em um novo commit.'
    - 'Na lixeira do sistema.'
  resposta: 1
  explicacao: 'O `git add` coloca as alterações na staging area, a "sala de espera" do próximo commit. Elas só entram no histórico com o `git commit`.'

- modulo: 2
  aula: 02-git-basico/01-como-o-git-funciona.md
  pergunta: 'Quando você faz um commit, o que o Git faz com os arquivos que **não mudaram** desde o commit anterior?'
  opcoes:
    - 'Guarda uma cópia nova de cada um deles.'
    - 'Apaga esses arquivos do histórico.'
    - 'Deixa esses arquivos de fora do commit para sempre.'
    - 'Não copia de novo: o commit aponta para a versão que já estava guardada.'
  resposta: 3
  explicacao: 'O commit é uma "foto" do projeto inteiro, mas o Git reaproveita o conteúdo que não mudou. Por isso o histórico ocupa pouco espaço.'

- modulo: 2
  aula: 02-git-basico/02-ciclo-de-vida-dos-arquivos.md
  pergunta: 'Você acabou de criar um arquivo novo na pasta do projeto e ainda não rodou nenhum comando. Em qual status ele está?'
  opcoes:
    - 'Untracked (não rastreado)'
    - 'Staged (preparado)'
    - 'Modified (modificado)'
    - 'Unmodified (não modificado)'
  resposta: 0
  explicacao: 'Arquivos novos começam como untracked: o Git vê que eles existem, mas não guarda o histórico deles até você usar `git add`.'

- modulo: 2
  aula: 02-git-basico/02-ciclo-de-vida-dos-arquivos.md
  pergunta: 'Um arquivo que já estava no último commit foi editado, mas você ainda não rodou `git add`. Qual é o status dele?'
  opcoes:
    - 'Untracked'
    - 'Staged'
    - 'Modified'
    - 'Committed'
  resposta: 2
  explicacao: 'Arquivo rastreado e alterado depois do último commit, mas ainda fora do staging, fica com o status modified.'

- modulo: 2
  aula: 02-git-basico/02-ciclo-de-vida-dos-arquivos.md
  pergunta: 'Qual comando mostra o status de cada arquivo e costuma sugerir o próximo passo?'
  opcoes:
    - '`git log`'
    - '`git status`'
    - '`git diff --stat`'
    - '`git show`'
  resposta: 1
  explicacao: '`git status` lista os arquivos untracked, modificados e preparados, e quase sempre mostra qual comando usar em seguida.'

- modulo: 2
  aula: 02-git-basico/03-gitignore.md
  pergunta: 'O que a linha `*.log` em um arquivo `.gitignore` faz?'
  opcoes:
    - 'Ignora só o arquivo chamado `*.log`.'
    - 'Apaga todos os arquivos `.log` do projeto.'
    - 'Versiona apenas os arquivos `.log`.'
    - 'Faz o Git ignorar todos os arquivos que terminam com `.log`.'
  resposta: 3
  explicacao: 'O `*` significa "qualquer coisa". Os arquivos `.log` continuam na pasta, mas o Git deixa de mostrá-los no status e não os inclui em `git add .`.'

- modulo: 2
  aula: 02-git-basico/03-gitignore.md
  pergunta: 'Você já tinha feito commit do arquivo `senha.env` e depois o colocou no `.gitignore`. O que acontece?'
  opcoes:
    - 'O Git continua rastreando o arquivo; é preciso rodar `git rm --cached senha.env`.'
    - 'O arquivo é removido automaticamente do histórico.'
    - 'O arquivo é apagado do computador.'
    - 'O Git mostra um erro e não aceita mais commits.'
  resposta: 0
  explicacao: 'O `.gitignore` só vale para arquivos ainda não rastreados. `git rm --cached` para de rastrear sem apagar do disco. Se o commit já foi enviado, troque a senha, porque ela continua no histórico.'

- modulo: 2
  aula: 02-git-basico/04-commits.md
  pergunta: 'Você criou um arquivo **novo** e rodou `git commit -am "Adiciona arquivo"`. O que acontece com esse arquivo?'
  opcoes:
    - 'Ele entra no commit normalmente.'
    - 'Ele não entra no commit, porque o `-a` só inclui arquivos já rastreados.'
    - 'O Git apaga o arquivo.'
    - 'O commit falha e nada é registrado.'
  resposta: 1
  explicacao: 'A opção `-a` faz `git add` automaticamente só de arquivos que o Git já acompanha. Arquivos novos precisam de `git add` antes.'

- modulo: 2
  aula: 02-git-basico/04-commits.md
  pergunta: 'Qual destas é a melhor mensagem de commit?'
  opcoes:
    - '`update`'
    - '`arrumei umas coisas`'
    - '`Corrige cálculo de frete para a região Norte`'
    - '`aaaa`'
  resposta: 2
  explicacao: 'Uma boa mensagem é curta, específica e diz o que a alteração faz. Mensagens genéricas não ajudam ninguém a entender o histórico depois.'

- modulo: 2
  aula: 02-git-basico/05-historico-do-projeto.md
  pergunta: 'Qual comando mostra os commits de forma resumida, um por linha?'
  opcoes:
    - '`git log --oneline`'
    - '`git log --stat`'
    - '`git status --short`'
    - '`git show --all`'
  resposta: 0
  explicacao: '`git log --oneline` mostra o hash curto e a mensagem de cada commit em uma única linha. É a forma mais prática de ter uma visão geral.'

- modulo: 2
  aula: 02-git-basico/05-historico-do-projeto.md
  pergunta: 'Como listar os commits cuja **mensagem** contém a palavra "login"?'
  opcoes:
    - '`git log --author="login"`'
    - '`git log --since="login"`'
    - '`git search login`'
    - '`git log --grep="login"`'
  resposta: 3
  explicacao: '`--grep` filtra pela mensagem do commit. `--author` filtra pelo autor e `--since` por data.'

- modulo: 2
  aula: 02-git-basico/06-voltando-no-tempo.md
  pergunta: 'O que acontece quando você roda `git checkout <hash>` de um commit antigo?'
  opcoes:
    - 'Os commits mais novos são apagados.'
    - 'O commit antigo é desfeito.'
    - 'Os arquivos voltam a ficar como naquele commit, em modo "detached HEAD", sem apagar nada.'
    - 'Uma nova branch é criada automaticamente.'
  resposta: 2
  explicacao: 'O checkout de um hash só muda o que você está vendo. Para voltar ao presente, use `git switch main`; para trabalhar a partir dali, crie uma branch com `git switch -c`.'

- modulo: 2
  aula: 02-git-basico/07-comandos-uteis.md
  pergunta: 'O que o comando `git diff`, sem opções, mostra?'
  opcoes:
    - 'As alterações que ainda **não** foram para a staging area.'
    - 'As alterações que vão entrar no próximo commit.'
    - 'As diferenças entre o seu repositório e o GitHub.'
    - 'A lista de arquivos ignorados.'
  resposta: 0
  explicacao: '`git diff` compara o working directory com a staging area. Para ver o que já está preparado, use `git diff --staged`.'

- modulo: 2
  aula: 02-git-basico/07-comandos-uteis.md
  pergunta: 'Como parar de rastrear um arquivo **sem** apagá-lo do seu computador?'
  opcoes:
    - '`git rm arquivo`'
    - '`git rm --cached arquivo`'
    - '`git restore arquivo`'
    - '`git mv arquivo`'
  resposta: 1
  explicacao: '`git rm --cached` tira o arquivo do controle do Git e mantém o arquivo no disco. Sem `--cached`, o `git rm` também apaga o arquivo da pasta.'

- modulo: 2
  aula: 02-git-basico/08-desfazendo-acoes.md
  pergunta: 'Você deu `git add` em um arquivo por engano. Como tirá-lo da staging area **mantendo** as alterações?'
  opcoes:
    - '`git restore arquivo`'
    - '`git reset --hard`'
    - '`git rm arquivo`'
    - '`git restore --staged arquivo`'
  resposta: 3
  explicacao: '`git restore --staged` só tira o arquivo do staging. Sem `--staged`, o `git restore` descartaria as alterações.'

- modulo: 2
  aula: 02-git-basico/08-desfazendo-acoes.md
  pergunta: 'Você fez um commit (ainda não enviado) e esqueceu de incluir um arquivo. Qual é a forma mais limpa de colocá-lo no mesmo commit?'
  opcoes:
    - 'Fazer outro commit só com o arquivo esquecido.'
    - '`git add arquivo` seguido de `git commit --amend --no-edit`.'
    - '`git revert HEAD` e depois commitar tudo de novo.'
    - '`git push --force` com o arquivo.'
  resposta: 1
  explicacao: 'O `--amend` substitui o último commit por um novo que inclui o que está no staging. Como reescreve o histórico, use só em commits que ainda não foram enviados.'

- modulo: 2
  aula: 02-git-basico/08-desfazendo-acoes.md
  pergunta: 'O que o comando `git rebase -i HEAD~3` permite fazer?'
  opcoes:
    - 'Editar, juntar (squash), reordenar ou remover os 3 últimos commits.'
    - 'Desfazer os 3 últimos commits e apagar as alterações.'
    - 'Enviar os 3 últimos commits para o GitHub.'
    - 'Criar 3 branches novas.'
  resposta: 0
  explicacao: 'O rebase interativo abre a lista dos commits no editor. Trocando `pick` por `squash`, `reword` ou `drop`, você edita o histórico recente.'

# ---------------------------------------------------------------- Módulo 3
- modulo: 3
  aula: 03-git-intermediario/01-branches.md
  pergunta: 'Tecnicamente, o que é uma branch no Git?'
  opcoes:
    - 'Uma cópia completa de todos os arquivos do projeto.'
    - 'Um repositório separado.'
    - 'Uma pasta especial dentro do projeto.'
    - 'Um ponteiro (etiqueta) que aponta para um commit e avança a cada novo commit.'
  resposta: 3
  explicacao: 'Por isso criar branches é instantâneo e leve: o Git só cria uma etiqueta apontando para o commit atual.'

- modulo: 3
  aula: 03-git-intermediario/01-branches.md
  pergunta: 'Qual comando cria uma branch nova **e** já troca para ela?'
  opcoes:
    - '`git branch nova`'
    - '`git switch -c nova`'
    - '`git merge nova`'
    - '`git checkout nova`'
  resposta: 1
  explicacao: '`git switch -c nova` (ou o tradicional `git checkout -b nova`) cria e troca. `git branch nova` só cria, e `git checkout nova` só troca para uma branch que já existe.'

- modulo: 3
  aula: 03-git-intermediario/01-branches.md
  pergunta: 'O que acontece ao rodar `git branch -d feature` se essa branch tem commits que ainda não foram mesclados?'
  opcoes:
    - 'O Git recusa a exclusão; para forçar seria preciso usar `-D`.'
    - 'A branch é apagada junto com os commits.'
    - 'Os commits são mesclados automaticamente na main.'
    - 'A branch é renomeada para `feature-old`.'
  resposta: 0
  explicacao: 'O `-d` é a forma segura: só apaga branches já mescladas, para você não perder trabalho. O `-D` força a exclusão.'

- modulo: 3
  aula: 03-git-intermediario/02-merge.md
  pergunta: 'Você quer trazer as alterações da branch `feature` para a `main`. O que faz?'
  opcoes:
    - 'Fica na `feature` e roda `git merge main`.'
    - 'Roda `git merge feature main` de qualquer branch.'
    - 'Vai para a `main` (`git switch main`) e roda `git merge feature`.'
    - 'Roda `git push feature main`.'
  resposta: 2
  explicacao: 'O merge sempre traz as alterações para a branch em que você está. Por isso, primeiro você vai para a branch que vai receber o trabalho.'

- modulo: 3
  aula: 03-git-intermediario/02-merge.md
  pergunta: 'Quando um merge é do tipo **fast-forward**?'
  opcoes:
    - 'Quando há conflitos que o Git resolve sozinho.'
    - 'Quando a branch de destino não recebeu commits novos desde que a outra branch foi criada.'
    - 'Quando as duas branches têm commits novos.'
    - 'Quando o merge é feito pelo GitHub.'
  resposta: 1
  explicacao: 'Nesse caso o Git só avança o ponteiro da branch de destino, sem criar commit de merge. Se as duas branches tiverem commits novos, o merge é de três vias.'

- modulo: 3
  aula: 03-git-intermediario/02-merge.md
  pergunta: 'Qual é a característica de um commit de merge (merge de três vias)?'
  opcoes:
    - 'Ele não tem mensagem.'
    - 'Ele apaga a branch que foi mesclada.'
    - 'Ele só pode ser criado no GitHub.'
    - 'Ele tem dois "pais": o último commit de cada branch.'
  resposta: 3
  explicacao: 'O commit de merge junta as duas linhas de desenvolvimento, por isso aponta para dois commits anteriores.'

- modulo: 3
  aula: 03-git-intermediario/02-merge.md
  pergunta: 'Para que serve `git merge --abort`?'
  opcoes:
    - 'Para cancelar um merge em andamento (com conflito) e voltar como estava antes.'
    - 'Para desfazer um merge que foi concluído há uma semana.'
    - 'Para apagar a branch que causou o conflito.'
    - 'Para aceitar automaticamente a versão da outra branch.'
  resposta: 0
  explicacao: 'O `--abort` só funciona durante um merge que parou com conflito. Para desfazer um merge já concluído, use `git reset` (se não enviou) ou `git revert` (se já enviou).'

- modulo: 3
  aula: 03-git-intermediario/02-merge.md
  pergunta: 'O que o comando `git cherry-pick <hash>` faz?'
  opcoes:
    - 'Apaga o commit indicado.'
    - 'Mostra os detalhes do commit.'
    - 'Copia aquele commit específico para a branch atual.'
    - 'Cria uma tag no commit.'
  resposta: 2
  explicacao: 'O cherry-pick ("colher a cereja") traz um único commit de outra branch, sem precisar mesclar a branch inteira.'

- modulo: 3
  aula: 03-git-intermediario/03-rebase.md
  pergunta: 'O que o `git rebase main` faz quando você está na branch `feature`?'
  opcoes:
    - 'Junta a `main` na `feature` criando um commit de merge.'
    - 'Reaplica os commits da `feature` no topo da `main`, deixando o histórico linear.'
    - 'Apaga a `main` e renomeia a `feature`.'
    - 'Envia a `feature` para o GitHub.'
  resposta: 1
  explicacao: 'O rebase "recorta" seus commits e os "cola" depois do último commit da `main`. Os commits reaplicados são novos, com hashes diferentes.'

- modulo: 3
  aula: 03-git-intermediario/03-rebase.md
  pergunta: 'Qual é a "regra de ouro" do rebase?'
  opcoes:
    - 'Sempre fazer rebase antes de cada commit.'
    - 'Só fazer rebase pelo site do GitHub.'
    - 'Usar rebase no lugar de todos os merges.'
    - 'Nunca fazer rebase em commits que já foram enviados e que outras pessoas podem estar usando.'
  resposta: 3
  explicacao: 'Como o rebase cria commits novos e descarta os antigos, reescrever commits compartilhados deixa o histórico de quem já os baixou inconsistente com o remoto.'

- modulo: 3
  aula: 03-git-intermediario/03-rebase.md
  pergunta: 'Durante um rebase você resolveu um conflito e rodou `git add`. Qual é o próximo comando?'
  opcoes:
    - '`git rebase --continue`'
    - '`git commit`'
    - '`git merge --continue`'
    - '`git push`'
  resposta: 0
  explicacao: 'No rebase, o processo segue com `git rebase --continue` (ou é cancelado com `git rebase --abort`). Não se usa `git commit` para concluir.'

- modulo: 3
  aula: 03-git-intermediario/04-clone-e-push.md
  pergunta: 'O que o `git clone` configura automaticamente?'
  opcoes:
    - 'Uma chave SSH.'
    - 'Uma tag com a versão atual.'
    - 'Um remoto chamado `origin`, apontando para o repositório de onde você clonou.'
    - 'Uma branch chamada `clone`.'
  resposta: 2
  explicacao: 'Além de baixar arquivos e histórico, o clone já deixa o remoto `origin` configurado, pronto para `git pull` e `git push`.'

- modulo: 3
  aula: 03-git-intermediario/04-clone-e-push.md
  pergunta: 'Para que serve o `-u` em `git push -u origin minha-branch`?'
  opcoes:
    - 'Para enviar só os arquivos atualizados.'
    - 'Para criar a branch no remoto e ligá-la à branch local, permitindo usar só `git push` depois.'
    - 'Para desfazer o último push.'
    - 'Para enviar todas as branches de uma vez.'
  resposta: 1
  explicacao: 'O `-u` (`--set-upstream`) liga a branch local à remota. A partir daí, `git push` e `git pull` sabem para onde enviar e de onde trazer.'

